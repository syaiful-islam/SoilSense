name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (protocol + app)
        run: bash .github/scripts/gradle-with-annotations.sh :core:modbus:test :app:testDebugUnitTest

      - name: Lint
        run: bash .github/scripts/gradle-with-annotations.sh :app:lintDebug

      - name: Assemble debug APK
        run: bash .github/scripts/gradle-with-annotations.sh :app:assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: soilsense-debug-apk
          path: app/build/outputs/apk/debug/*.apk
