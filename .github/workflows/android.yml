name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (protocol + app)
        run: bash .github/scripts/gradle-with-annotations.sh :core:modbus:test :app:testDebugUnitTest

      - name: Lint
        run: bash .github/scripts/gradle-with-annotations.sh :app:lintDebug

      - name: Assemble debug APK
        run: bash .github/scripts/gradle-with-annotations.sh :app:assembleDebug

      - name: Check APK file name
        run: |
          ls app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/SoilSensor-debug.apk \
            || { echo "::error title=APK name::expected SoilSensor-debug.apk, got: $(ls app/build/outputs/apk/debug/)"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: SoilSensor-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # Runs instrumented tests (Room, Compose UI) on an emulator and captures screenshots of every
  # screen. The PNGs are force-pushed to the `screenshots` branch for visual review.
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/device-tests.sh

      - name: Publish screenshots branch
        if: always() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -n "$(ls -A screenshots 2>/dev/null)" ] || { echo "no screenshots"; exit 0; }
          cd screenshots
          git init -q -b screenshots
          git add .
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/
          if-no-files-found: ignore
